services:
  api:
    build:
      context: app
      target: production
    container_name: fastapi_prod
    env_file:
      - .env.production
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      - postgres
    restart: unless-stopped
  
  postgres:
    image: postgres:15.3-alpine
    container_name: postgres_dev
    env_file:
      - .env.production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: